# cargo-deny policy (CI job `dependency-policy`, blocking). Run locally with
# `cargo deny check`.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # tokio::io::unix::AsyncFd::new accepts RawFd; mmo never calls AsyncFd
    # (only TcpListener/TcpStream/UdpSocket). Remove once tokio patches.
    "RUSTSEC-2026-0386",
    # crypto-bigint 0.5.5 timing variability via p256 0.13.2 (locked by
    # elliptic-curve 0.13); mmo uses p256 strictly for public verification of
    # hardware-backed ES256 signatures and test fixtures — never server secrets.
    # Remove once p256 0.14 / crypto-bigint 0.7.6 releases.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
