# One regional authority cell (development):
# - `authority`: unified `fppd serve --no-witness` serving Liveness, Verifier,
#   Broker, Revocation Feed, Evidence Store, and Transparency Log over our
#   owned Noise_IK TCP + deterministic CBOR protocol (port 4444/tcp).
# - `witness`: independent `fppd role witness` container cosigning Transparency
#   Log checkpoints (in production, run by an independent operator).
# - `enforce` / `audit` / `ticket` (`tools` profile): operator CLIs.
#
#   docker compose -f deploy/cell/docker-compose.yml up --build

name: fpp-cell

networks:
  cell:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  state:

services:
  init:
    build:
      context: ../..
      dockerfile: deploy/cell/Dockerfile
    image: fpp-cell:dev
    restart: "no"
    command: ["init", "--dir", "/var/lib/fpp/cell", "--bundle", "/var/lib/fpp/keys/fpp_key_bundle.json"]
    volumes:
      - state:/var/lib/fpp

  authority:
    image: fpp-cell:dev
    read_only: true
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      cell:
        ipv4_address: 172.30.0.10
    ports:
      - "4444:4444/tcp"
    command:
      - serve
      - --no-witness
      - --dir
      - /var/lib/fpp/cell
      - --bundle
      - /var/lib/fpp/keys/fpp_key_bundle.json
      - --bind
      - 0.0.0.0:4444
    volumes:
      - state:/var/lib/fpp

  witness:
    image: fpp-cell:dev
    read_only: true
    restart: on-failure
    depends_on:
      - authority
    networks: [cell]
    command:
      - role
      - witness
      - --dir
      - /var/lib/fpp/cell
      - --log
      - 172.30.0.10:4444
      - --bundle
      - /var/lib/fpp/keys/fpp_key_bundle.json
      - --interval-s
      - "1"
    volumes:
      - state:/var/lib/fpp

  enforce:
    image: fpp-cell:dev
    profiles: [tools]
    restart: "no"
    networks: [cell]
    entrypoint:
      - fppd
      - enforce
      - --dir
      - /var/lib/fpp/cell
      - --authority
      - 172.30.0.10:4444
      - --bundle
      - /var/lib/fpp/keys/fpp_key_bundle.json
    volumes:
      - state:/var/lib/fpp

  audit:
    image: fpp-cell:dev
    profiles: [tools]
    restart: "no"
    networks: [cell]
    entrypoint:
      - fppd
      - evidence
      - --dir
      - /var/lib/fpp/cell
      - --authority
      - 172.30.0.10:4444
      - --bundle
      - /var/lib/fpp/keys/fpp_key_bundle.json
    volumes:
      - state:/var/lib/fpp
