[workspace]
members = [
    "crates/fpp",
    "crates/fpp-attest",
    "crates/fpp-ffi",
    "crates/fppd",
    "crates/fpp-sim",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
tokio = { version = "1.48", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

# Owned cryptographic primitives (COSE_Sign1, Noise IK, Merkle, AEAD, hybrid ML-DSA-65).
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4.1", default-features = false }
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
subtle = "2.6"
rand = "0.8"
hex = "0.4"

# Authority-only: ML-DSA-65 (s1h) and hardware attestation X.509/RSA/ECDSA appraisal.
aws-lc-rs = "1.18"
x509-parser = "0.18"

# Optional mobile Play Integrity JSON & test fixtures only (never on wire/protocol hot paths).
serde_json = "1"
rcgen = "0.12"

# Keep debug binary SHA-256 hashing fast for sw_hash self-measurement (F06).
[profile.dev.package.sha2]
opt-level = 3
