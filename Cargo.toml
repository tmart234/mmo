[workspace]
members = [
    "crates/fpp-types",
    "crates/fpp-wire",
    "crates/fpp-crypto",
    "crates/fpp-merkle",
    "crates/fpp-tokens",
    "crates/fpp-session",
    "crates/fpp-ffi",
    "crates/fpp-audit",
    "crates/attest-core",
    "crates/attest-android",
    "crates/attest-apple",
    "crates/attest-tpm",
    "crates/common",
    "crates/gs-sim",
    "crates/vs",
    "crates/tools",
    "crates/client-core",
    "crates/gs-core",
    "crates/client-bevy",
    "game",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
bevy = { version = "0.17.2", default-features = false }
anyhow = "1.0"
tokio = { version = "1.48", features = ["full"] }

# QUIC control links (ADR-002). aws-lc-rs provides X25519MLKEM768 (04 §3, FPP-T1).
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log", "bloom"] }
rustls = { version = "0.23.34", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
ctrlc = "3.5"
bincode = "1.3"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde-big-array = "0.5"
rcgen = "0.12"
# Verifier appraisal of platform evidence (attest-*): X.509 parsing, and
# signature checks with the same aws-lc-rs the TLS stack uses.
x509-parser = "0.18"
aws-lc-rs = "1.18"
thiserror = "2.0"
dashmap = "6"
once_cell = "1.19"
prometheus = "0.14"
lazy_static = "1.4"
# gs-sim hashes its own executable at start (sw_hash, finding F06); an
# unoptimized SHA-256 over a debug binary of ~80 MB took ~5 s and made the
# smoke test's client give up before the first Checkpoint.
[profile.dev.package.sha2]
opt-level = 3
