[package]
name = "svc-log"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The Transparency Log service and its witness (04 §8.2), each a separate process with its own keys"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
fpp-log = { path = "../fpp-log" }
fpp-crypto = { path = "../fpp-crypto", features = ["s1h"] }
fpp-types = { path = "../fpp-types" }
fpp-svc = { path = "../fpp-svc" }

[[bin]]
name = "svc-log"
path = "src/bin/svc-log.rs"

[[bin]]
name = "svc-witness"
path = "src/bin/svc-witness.rs"

[dev-dependencies]
fpp-merkle = { path = "../fpp-merkle" }
fpp-wire = { path = "../fpp-wire" }
