[package]
name = "fpp-svc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Trust-plane service plumbing: per-service identities from a cell CA, mutual TLS over QUIC, caller authorization, and framed RPC"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
serde = { workspace = true }
x509-parser = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
common = { path = "../common" }
fpp-crypto = { path = "../fpp-crypto" }
fpp-wire = { path = "../fpp-wire" }

[[bin]]
name = "fpp-cell"
path = "src/bin/fpp-cell.rs"
