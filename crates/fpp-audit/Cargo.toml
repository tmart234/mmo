[package]
name = "fpp-audit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Fair-Play Protocol v1: audits a player-hosted match's evidence bundles (milestone M4, accounting audit)"

[[bin]]
