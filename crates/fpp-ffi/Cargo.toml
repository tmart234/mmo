[package]
name = "fpp-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Fair-Play Protocol v1 SDK for C/C++ games: stable C ABI over owned pure-Rust fpp (zero tokio, zero quinn/rustls, zero bincode)"

[lib]
name = "fpp"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
fpp_core = { package = "fpp", path = "../fpp" }
ed25519-dalek = { workspace = true }
rand = { workspace = true }

[features]
default = []
# gs-link: a dedicated server's Noise_IK TCP link to Server Liveness (pure std, zero tokio/quinn).
gs-link = []

[dev-dependencies]
cbindgen = "0.29"
p256 = { workspace = true }
