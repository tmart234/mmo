[package]
name = "fpp-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Fair-Play Protocol v1 SDK for C/C++ games: stable C ABI over fpp-wire, fpp-crypto, fpp-merkle and fpp-session"

[lib]
name = "fpp"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
fpp-types = { path = "../fpp-types" }
fpp-wire = { path = "../fpp-wire" }
fpp-crypto = { path = "../fpp-crypto" }
fpp-merkle = { path = "../fpp-merkle" }
fpp-session = { path = "../fpp-session" }
fpp-tokens = { path = "../fpp-tokens" }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
# gs-link: a dedicated server's link to Server Liveness (QUIC); off by default
common = { path = "../common", optional = true }
quinn = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[features]
default = []
gs-link = ["dep:common", "dep:quinn", "dep:tokio", "dep:anyhow"]

[dev-dependencies]
cbindgen = "0.29"
p256 = { workspace = true }
