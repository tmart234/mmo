language = "C"
header = """/* fpp.h: Fair-Play Protocol v1 SDK for C/C++ games.
 *
 * GENERATED by cbindgen from crates/fpp-ffi/src/lib.rs. Do not edit; run
 * `FPP_REGEN_HEADER=1 cargo test -p fpp-ffi --test header` after changing the
 * Rust side. Spec: docs/anticheat/04-protocol.md. Plain C99, 32- and 64-bit.
 */"""
include_guard = "FPP_H"
cpp_compat = true
usize_is_size_t = true
style = "both"
documentation_style = "c99"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["FppStatus", "FppInputCommitInfo", "FppCheckpointInfo"]
