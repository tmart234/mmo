[package]
name = "svc-liveness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Server Liveness (04 §6.3): admits game servers on TPM 2.0 evidence and issues their SAR chain, with its own key, in its own process"

[dependencies]
anyhow        = { workspace = true }
tokio         = { workspace = true }
quinn         = { workspace = true }
clap          = { workspace = true }
dashmap       = { workspace = true }
ed25519-dalek = { workspace = true }
rand          = { workspace = true }
hex           = { workspace = true }

common        = { path = "../common" }
fpp-types     = { path = "../fpp-types" }
fpp-wire      = { path = "../fpp-wire" }
fpp-crypto    = { path = "../fpp-crypto" }
fpp-tokens    = { path = "../fpp-tokens" }
fpp-svc       = { path = "../fpp-svc" }
svc-evidence  = { path = "../svc-evidence" }
attest-tpm    = { path = "../attest-tpm" }
attest-core   = { path = "../attest-core" }

[dev-dependencies]
gs-sim = { path = "../gs-sim" }
sha2 = { workspace = true }

[[bin]]
name = "svc-liveness"
path = "src/main.rs"
