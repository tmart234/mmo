[package]
name = "attest-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Verifier appraisal of Android Keystore key attestation (KeyMint): chain to Google's roots, revocation, verified boot, app identity"

[dependencies]
attest-core = { path = "../attest-core" }
serde_json = { workspace = true }
# Play Integrity tokens: AES key wrap, AES-GCM, ECDSA P-256
aws-lc-rs = { workspace = true }

[features]
# Play Integrity token minting, for other crates' tests
testing = []

[dev-dependencies]
attest-android = { path = ".", features = ["testing"] }
rcgen = { workspace = true }
fpp-types = { path = "../fpp-types" }
