name: Release

# Reproducible CI build with SLSA provenance (GitHub artifact attestations,
# Sigstore) and Build Registry line for `fppd`.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gs-release.yml"
  workflow_dispatch:

concurrency:
  group: fpp-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build fppd
        run: |
          cargo build --release --locked -p fppd --bin fppd
          mkdir dist
          cp target/release/fppd dist/fppd-x86_64-linux

      - name: Build Registry line
        id: registry
        run: |
          short="${GITHUB_SHA:0:12}"
          hash="$(sha256sum dist/fppd-x86_64-linux | cut -d' ' -f1)"
          echo "$hash  fppd x86_64-linux $short (run $GITHUB_RUN_NUMBER)" > dist/build-registry.txt
          cat dist/build-registry.txt
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/fppd-x86_64-linux

      - name: Release
        env:
          SHORT: ${{ steps.registry.outputs.short }}
        run: |
          {
            echo "fppd built by CI from $GITHUB_SHA ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo
            echo "Check its provenance before deploying: \`gh attestation verify fppd-x86_64-linux --repo $GITHUB_REPOSITORY\`"
            echo
            echo "Build Registry line:"
            echo
            echo '```'
            cat dist/build-registry.txt
            echo '```'
          } > notes.md
          gh release create "fpp-$SHORT" dist/fppd-x86_64-linux dist/build-registry.txt \
            --target "$GITHUB_SHA" --title "fppd $SHORT" --notes-file notes.md --latest=false
