name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Key files by name (raw seeds, DER keys, anything in keys/), and any
      # tracked file holding a PEM private key. Public certificates, such as
      # the vendored attestation roots in crates/fpp-attest/roots/, are allowed.
      - name: No private key material in git
        run: |
          if git ls-files | grep -E '\.pk8$|\.key\.der$|\.seed$|(^|/)keys/[^/]+$' | grep -v '/\.gitignore$'; then
            echo "::error::private key material is tracked by git (generate it with fppd init instead)"
            exit 1
          fi
          if git grep -lI -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::a PEM private key is tracked by git"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Real TPM 2.0 (swtpm + tpm2-tools) for fpp-attest, fppd, and attestation_exit.
      - name: swtpm and tpm2-tools
        run: sudo apt-get update -q && sudo apt-get install -y -q swtpm swtpm-tools tpm2-tools

      # Independent Go sumdb check (interop/go/tlog, run by fpp::log tests).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Run full CI (fmt, clippy, build, test, 5 exit suites, interop, C SDK)
        run: make ci
        env:
          FPP_REQUIRE_SWTPM: "1"
          FPP_REQUIRE_GO: "1"

      # The Halo: CE port (first reference title) is 32-bit x86: keep the pure-Rust
      # C SDK (including gs-link) building and conforming for that ABI.
      - name: C SDK conformance on i686 (Halo ABI)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-multilib
          rustup target add i686-unknown-linux-gnu
          make ffi-c-test-i686

  # One regional authority cell in containers (deploy/cell): unified fppd authority
  # + independent witness container, plus an Enforcement action logged and cosigned.
  cell-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the cell
        run: docker compose -f deploy/cell/docker-compose.yml up -d --build
      - name: Authority and independent witness running; enforcement logged and cosigned
        run: |
          compose="docker compose -f deploy/cell/docker-compose.yml"
          for i in $(seq 30); do
            $compose logs authority | grep -q '\[fppd\] ready' && break
            sleep 1
          done
          test "$($compose ps --status running --services | sort | tr '\n' ' ')" = "authority witness "
          $compose run --rm enforce kick "session:$(printf '07%.0s' $(seq 32))" --note "CI"
          $compose logs authority | grep -q "log index"
          for i in $(seq 15); do
            $compose logs witness | grep -q "cosigned size" && break
            sleep 1
          done
          $compose logs witness | grep -q "cosigned size"
          $compose logs
      - name: Stop the cell
        if: always()
        run: docker compose -f deploy/cell/docker-compose.yml down -v

  # Advisories (RustSec), licenses, bans and sources, per deny.toml (zero ignores).
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Short fuzzing pass over every decoder and verifier of untrusted input.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Seed the FPP corpus with the golden vectors
        run: |
          python3 - <<'PY'
          import json, pathlib
          out = pathlib.Path("fuzz/corpus/fpp_decode"); out.mkdir(parents=True, exist_ok=True)
          for o in json.load(open("interop/vectors/fpp1.json"))["objects"]:
              (out / o["name"].replace("/", "_")).write_bytes(bytes.fromhex(o["cose"]))
          PY
      - name: Fuzz (60 s per target)
        run: |
          for target in wire_decode verify_untrusted fpp_decode p2p_recv tpm_evidence log_parse; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60 -rss_limit_mb=2048
          done
