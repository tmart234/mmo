[package]
name = "mmo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ed25519-dalek = "2.2"
fpp = { path = "../crates/fpp", features = ["s1h", "log"] }
fpp-attest = { path = "../crates/fpp-attest", features = ["tpm", "mobile"] }
fpp-sim = { path = "../crates/fpp-sim" }

# Separate workspace: built only by `cargo +nightly fuzz`, never by the main CI.
[workspace]
members = ["."]

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_untrusted"
path = "fuzz_targets/verify_untrusted.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fpp_decode"
path = "fuzz_targets/fpp_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "p2p_recv"
path = "fuzz_targets/p2p_recv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tpm_evidence"
path = "fuzz_targets/tpm_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_parse"
path = "fuzz_targets/log_parse.rs"
test = false
doc = false
bench = false
