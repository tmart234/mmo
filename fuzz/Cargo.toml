[package]
name = "mmo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bincode = "1.3"
serde = "1"
ed25519-dalek = "2.2"
common = { path = "../crates/common" }
gs-sim = { path = "../crates/gs-sim" }

# Separate workspace: built only by `cargo +nightly fuzz`, never by the main CI.
[workspace]
members = ["."]

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_untrusted"
path = "fuzz_targets/verify_untrusted.rs"
test = false
doc = false
bench = false
